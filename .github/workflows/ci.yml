name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k3s-demo-api:test ./app

      - name: Smoke test Docker image
        run: |
          docker network create smoke-test
          docker run -d --name redis-test --network smoke-test redis:8-alpine
          docker run -d --name api-test --network smoke-test -e REDIS_URL=redis://redis-test:6379 -p 3000:3000 k3s-demo-api:test
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f api-test redis-test || true
          docker network rm smoke-test || true

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: k3s-demo-api:test
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag k3s-demo-api:test ghcr.io/mattraw57/k3s-demo-api:${{ github.sha }}
          docker tag k3s-demo-api:test ghcr.io/mattraw57/k3s-demo-api:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/mattraw57/k3s-demo-api:${{ github.sha }}
          docker push ghcr.io/mattraw57/k3s-demo-api:latest

  update-manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Kubernetes image
        run: |
          sed -i "s|image: ghcr.io/mattraw57/k3s-demo-api:.*|image: ghcr.io/mattraw57/k3s-demo-api:${{ github.sha }}|" \
            k8s/devops-demo/deployment.yaml

      - name: Commit deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/devops-demo/deployment.yaml

          if git diff --cached --quiet; then
            echo "Manifest already uses this image"
            exit 0
          fi

          git commit -m "Deploy ${{ github.sha }} [skip ci]"
          git push origin HEAD:main
