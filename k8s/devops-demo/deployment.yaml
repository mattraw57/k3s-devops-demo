apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-api

  template:
    metadata:
      labels:
        app: demo-api

    spec:
      containers:
        - name: api
          image: ghcr.io/mattraw57/k3s-demo-api:b079ce471959fe5de8c2fa96278772e0182e5684
          ports:
            - containerPort: 3000

          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: demo-api-config
                  key: REDIS_URL

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

