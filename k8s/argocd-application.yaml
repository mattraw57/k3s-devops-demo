apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mattraw57/k3s-devops-demo.git
    targetRevision: main
    path: k8s/devops-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo

  syncPolicy:
    automated:
      selfHeal: true
